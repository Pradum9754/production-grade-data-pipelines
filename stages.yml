trigger: none
pool: todo-app-agent
name: todo-app
stages:
  - stage: terraforminit
    displayName: terraform-init
    jobs:
      - job: terraforminit
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'todo-connection'
            backendAzureRmResourceGroupName: 'Stages-rg'
            backendAzureRmStorageAccountName: 'storagestages321'
            backendAzureRmContainerName: '"stagescon'
            backendAzureRmKey: 'terraform.tfstate'
  - stage: terraformvalidationplan
    displayName: terraform-validation-plan
    jobs:
      - job: terraformvalidationplan
        steps: 
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'todo-connection'
            backendAzureRmResourceGroupName: 'Stages-rg'
            backendAzureRmStorageAccountName: 'storagestages321'
            backendAzureRmContainerName: '"stagescon'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'todo-connection'
  - stage: terraformapply
    displayName: terraform-apply
    jobs:
      - job: terraformapply
        steps: 
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'todo-connection'
            backendAzureRmResourceGroupName: 'Stages-rg'
            backendAzureRmStorageAccountName: 'storagestages321'
            backendAzureRmContainerName: '"stagescon'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'todo-connection'
			
			
